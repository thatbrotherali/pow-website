   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(338.483846 95.987047)">falling objects converge on the centre:</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(338.860158 104.698766)">the tidal effect, present in every frame</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Inter'; text-anchor: middle; fill: #0b0b0b" x="403.752971" y="14.47875" transform="rotate(-0 403.752971 14.47875)">A large region near Earth</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #52514e" x="251.3565" y="196.101707" transform="rotate(-0 251.3565 196.101707)">The equivalence of gravity and acceleration holds only in a small region; over a larger one, the convergence of falling bodies distinguishes them.</text>
  </g>
