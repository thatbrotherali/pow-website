    <text style="font-size: 6.9px; font-family: 'Inter'; fill: #c4620a" transform="translate(13.115528 170.41223)">quark pairs meet their mirrors and</text>
    <text style="font-size: 6.9px; font-family: 'Inter'; fill: #c4620a" transform="translate(19.503958 178.760961)">unwind into light; about one in</text>
    <text style="font-size: 6.9px; font-family: 'Inter'; fill: #c4620a" transform="translate(25.317747 187.109691)">a billion survives as matter</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.9px; font-family: 'Inter'; fill: #c4620a" transform="translate(145.142296 170.41223)">electron–positron pairs unwind;</text>
    <text style="font-size: 6.9px; font-family: 'Inter'; fill: #c4620a" transform="translate(158.013491 178.760961)">the survivors match the</text>
    <text style="font-size: 6.9px; font-family: 'Inter'; fill: #c4620a" transform="translate(170.62971 187.109691)">protons' charge</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.9px; font-family: 'Inter'; text-anchor: start; fill: #8a8984" x="12.990534" y="14.659597" transform="rotate(-0 12.990534 14.659597)">ESTABLISHED: the standard history of the cooling universe.  Orange: what did not last.</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #9aa3ad" x="196.397436" y="208.225843" transform="rotate(-0 196.397436 208.225843)">1 minute</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #9aa3ad" x="324.731164" y="208.225843" transform="rotate(-0 324.731164 208.225843)">1 year</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #9aa3ad" x="459.323769" y="208.225843" transform="rotate(-0 459.323769 208.225843)">1 million years</text>
   </g>
  </g>
 </g>
