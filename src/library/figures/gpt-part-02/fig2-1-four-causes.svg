   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="16.416" y="18.72" transform="rotate(-0 16.416 18.72)">Aristotle's four causes, illustrated by a bronze statue</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="136.296" y="62.429126" transform="rotate(-0 136.296 62.429126)">Material cause</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.6px; font-family: 'Inter'; text-anchor: start; fill: #52514e" x="136.296" y="75.398248" transform="rotate(-0 136.296 75.398248)">What is it made of?  (bronze)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #008300" x="293.472" y="67.995141" transform="rotate(-0 293.472 67.995141)">kept (matter)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="136.296" y="111.677126" transform="rotate(-0 136.296 111.677126)">Formal cause</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.6px; font-family: 'Inter'; text-anchor: start; fill: #52514e" x="136.296" y="124.646248" transform="rotate(-0 136.296 124.646248)">What is its form?  (the shape of a man)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #008300" x="293.472" y="117.243141" transform="rotate(-0 293.472 117.243141)">kept (mathematics)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Inter'; text-anchor: start; fill: #8a8984" x="136.296" y="160.925126" transform="rotate(-0 136.296 160.925126)">Efficient cause</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'Inter'; text-anchor: start; fill: #8a8984" x="136.296" y="173.894248" transform="rotate(-0 136.296 173.894248)">What acts upon it?  (the sculptor's hands)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(293.472 162.135281)">set aside: Newton 1713 ('hypotheses non fingo');</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(293.472 170.847)">Hume 1748, Mach 1883, Russell 1913, Heisenberg 1927</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Inter'; text-anchor: start; fill: #8a8984" x="136.296" y="210.173126" transform="rotate(-0 136.296 210.173126)">Final cause</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'Inter'; text-anchor: start; fill: #8a8984" x="136.296" y="223.142248" transform="rotate(-0 136.296 223.142248)">What is it for?  (to honour someone)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(293.472 211.383281)">set aside: Bacon 1623 ('barren');</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(293.472 220.095)">Descartes 1644</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #52514e" x="16.416" y="258.7392" transform="rotate(-0 16.416 258.7392)">Purpose went first, then the efficient cause (mechanism), then the idea of cause itself. What remained were matter and mathematics.</text>
   </g>
  </g>
 </g>
