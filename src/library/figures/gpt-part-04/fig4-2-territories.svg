    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #52514e" transform="translate(279.296 175.266162)">changes below a₀</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(246.797373 227.235651)">Clocks, light,</text>
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(236.967029 236.359958)">black holes, waves</text>
   </g>
