   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(247.243717 63.468733)">Galaxies and</text>
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(255.173326 72.513797)">clusters</text>
   </g>
   <g id="text_5">
