    <text style="font-size: 8px; font-family: 'Inter'; text-anchor: middle; fill: #2a78d6" x="71.208" y="136.3492" transform="rotate(-0 71.208 136.3492)">Parts 15–22</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(20.669469 152.917772)">Gravitons; fields; mass; time;</text>
