   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter'; text-anchor: middle; fill: #0b0b0b" x="71.208" y="28.90165" transform="rotate(-0 71.208 28.90165)">Foundations</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Inter'; text-anchor: middle; fill: #2a78d6" x="71.208" y="44.8732" transform="rotate(-0 71.208 44.8732)">Parts 2–4</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(16.217906 61.403616)">How mechanism was set aside;</text>
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(38.8885 72.446021)">what gravity does;</text>
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(44.735656 84.341159)">Newton to GPT</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter'; text-anchor: middle; fill: #0b0b0b" x="204.696" y="28.90165" transform="rotate(-0 204.696 28.90165)">The core theory</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Inter'; text-anchor: middle; fill: #2a78d6" x="204.696" y="44.8732" transform="rotate(-0 204.696 44.8732)">Parts 5–8</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(158.798656 61.282788)">Gravity as pressure; work;</text>
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(172.939016 72.527536)">the illusion of pull;</text>
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(157.405375 83.638159)">where GR and GPT diverge</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter'; text-anchor: middle; fill: #0b0b0b" x="338.184" y="28.90165" transform="rotate(-0 338.184 28.90165)">Evidence and extensions</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Inter'; text-anchor: middle; fill: #2a78d6" x="338.184" y="44.8732" transform="rotate(-0 338.184 44.8732)">Parts 9–14</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(283.182344 61.253882)">Existing evidence; applications;</text>
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(276.115922 72.484177)">four demonstrations; epistemology;</text>
    <text style="font-size: 7.4px; font-family: 'Inter'; fill: #52514e" transform="translate(303.238078 83.787894)">the Moon; transition</text>
   </g>
   <g id="text_10">
