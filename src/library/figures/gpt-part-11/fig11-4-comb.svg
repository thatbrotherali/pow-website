   <g id="text_3">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #1baf7a" transform="translate(70.623337 182.079281)">the medium behind</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #1baf7a" transform="translate(66.776962 190.791)">presses the stream in</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="328.0608" y="32.787" transform="rotate(-0 328.0608 32.787)">The comb</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 53.4834)">its charge holds the medium</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 62.195119)">around it in a strained state:</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 70.906837)">the electric field</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Inter'; text-anchor: start; fill: #eb6834" x="328.0608" y="99.315" transform="rotate(-0 328.0608 99.315)">The stream</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 120.0114)">takes up the opposite</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 128.723119)">charge from the ground</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 137.434837)">as it leaves the tap</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Inter'; text-anchor: start; fill: #2a78d6" x="328.0608" y="165.843" transform="rotate(-0 328.0608 165.843)">The energy</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 186.5394)">a few millionths of a joule</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 195.251119)">each second, from the</text>
    <text style="font-size: 7.2px; font-family: 'Inter'; fill: #52514e" transform="translate(328.0608 203.962837)">strained medium</text>
   </g>
